name: Update market data

on:
  schedule:
    # 下午 15:00 - 17:00 狂轰滥炸，每隔 20 分钟触发一次，总有一次能排上！
    - cron: '5 7 * * *'    # 15:05
    - cron: '25 7 * * *'   # 15:25
    - cron: '45 7 * * *'   # 15:45
    - cron: '5 8 * * *'    # 16:05
    - cron: '25 8 * * *'   # 16:25
    - cron: '45 8 * * *'   # 16:45
    # 晚上 19:00 再跑一次抓龙虎榜
    - cron: '0 11 * * *'   # 19:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 运行抓取脚本
        run: python fetch_data.py

      - name: 提交更新后的 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "data: $(date -u +%F)"
          git push
